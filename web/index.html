<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Collab</title>
  <meta name="description" content="Your agent asks anyone's agent for anything — over A2A, with Gemini — and your private notes are never shared.">
  <meta name="theme-color" content="#0a0a0a">
  <!-- The look chosen in Settings (Auto follows the device), applied before anything paints. -->
  <script>
    // Auto (follows the device), Light or Dark — kept on this device.
    window.applyLook = () => { let t = "auto"; try { t = localStorage.getItem("collab-theme") || "auto"; } catch {}
      const look = t === "auto" || !["light", "dark"].includes(t) ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
      document.documentElement.dataset.look = look;
      document.documentElement.dataset.motion = "off"; // no animations: things appear in place
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", look === "light" ? "#f7f7f5" : "#0a0a0a"); };
    applyLook(); try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyLook); } catch {}
  </script>
